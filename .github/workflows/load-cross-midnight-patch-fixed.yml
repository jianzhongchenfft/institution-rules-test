name: Load cross-midnight patch fixed

on:
  push:
    paths:
      - '.github/workflows/load-cross-midnight-patch-fixed.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add cross-midnight module to load chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v51/part07.txt')
          s=p.read_text(encoding='utf-8')
          anchor="      eval(await overtimePersonalHoursRes.text());\n\n"
          block=("      eval(await overtimePersonalHoursRes.text());\n\n"
                 "      const overtimeCrossMidnightRes = await fetch('v52/overtime-cross-midnight-patch.txt',{cache:'no-store'});\n"
                 "      if(!overtimeCrossMidnightRes.ok) throw new Error(`v52/overtime-cross-midnight-patch.txt 載入失敗（${overtimeCrossMidnightRes.status}）`);\n"
                 "      eval(await overtimeCrossMidnightRes.text());\n\n")
          if 'overtime-cross-midnight-patch.txt' in s:
              raise SystemExit('cross-midnight loader already present')
          if anchor not in s:
              raise SystemExit('personal-hours loader anchor not found')
          p.write_text(s.replace(anchor,block,1),encoding='utf-8')
          PY
      - name: Static check
        run: grep -q "overtime-cross-midnight-patch.txt" v51/part07.txt
      - name: Commit loader
        run: |
          git config user.name "openai-maintenance-bot"
          git config user.email "openai-maintenance-bot@users.noreply.github.com"
          git add v51/part07.txt
          git commit -m "Load cross-midnight overtime integration"
          git push origin main
