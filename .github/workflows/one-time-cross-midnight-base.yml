name: One-time cross-midnight base frontend

on:
  push:
    paths:
      - '.github/workflows/one-time-cross-midnight-base.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update base overtime module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('v52/overtime-patch.txt')
          s = path.read_text(encoding='utf-8')

          def sub1(pattern, repl, label):
              global s
              s2, n = re.subn(pattern, repl, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              s = s2

          sub1(
              r"  function overtimeMinutesBetween\(start,end\)\{.*?\n  \}\n\n  function overtimeTimeParts",
              '''  function overtimeMinutesBetween(start,end){
            const s=overtimeNormalizeTime(start),e=overtimeNormalizeTime(end);
            if(!overtimeValid24h(s) || !overtimeValid24h(e)) return 0;
            const toMin = value => {
              const [h,m] = String(value).split(':').map(Number);
              return h*60 + m;
            };
            const sm=toMin(s),em=toMin(e);
            if(sm===em) return 0;
            return em>sm ? em-sm : (1440-sm)+em;
          }

          function overtimeCrossesMidnight(start,end){
            const s=overtimeNormalizeTime(start),e=overtimeNormalizeTime(end);
            if(!overtimeValid24h(s)||!overtimeValid24h(e)) return false;
            const toMin=value=>{const [h,m]=String(value).split(':').map(Number);return h*60+m;};
            return toMin(e)<toMin(s);
          }

          function overtimeNextDate(date){
            const m=String(date||'').match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);
            if(!m) return '';
            const d=new Date(Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3])+1));
            return d.toISOString().slice(0,10);
          }

          function overtimeSegments(row){
            if(!row||row.request_type==='holiday_visit_comp') return [];
            const start=overtimeNormalizeTime(row.start_time),end=overtimeNormalizeTime(row.end_time);
            if(!overtimeValid24h(start)||!overtimeValid24h(end)) return [];
            const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);
            const smin=sh*60+sm,emin=eh*60+em;
            if(smin===emin) return [];
            const common={requestId:row.id,staffId:row.applicant_staff_id,compensationMethod:row.compensation_method,reason:row.reason||'',createdAt:row.created_at||'',row};
            if(emin>smin){
              return [{...common,segmentIndex:1,date:row.work_date,type:row.request_type,startTime:start,endTime:end,startMin:smin,minutes:emin-smin}];
            }
            const out=[{...common,segmentIndex:1,date:row.work_date,type:row.request_type,startTime:start,endTime:'24:00',startMin:smin,minutes:1440-smin}];
            if(emin>0){
              out.push({...common,segmentIndex:2,date:overtimeNextDate(row.work_date),type:row.next_day_request_type||null,startTime:'00:00',endTime:end,startMin:0,minutes:emin});
            }
            return out;
          }

          function overtimeRowTouchesRange(row,start,end){
            if(row?.request_type==='holiday_visit_comp') return row.work_date>=start&&row.work_date<=end;
            return overtimeSegments(row).some(seg=>seg.date>=start&&seg.date<=end);
          }

          globalThis.v52OvertimeSegments=overtimeSegments;

          function overtimeTimeParts''',
              'duration and segment helpers'
          )

          old_select = ".select('id,applicant_staff_id,applicant_name,applicant_role,work_date,request_type,start_time,end_time,overtime_minutes,compensation_method,reason,holiday_case_count,comp_minutes,notes,status,review_note,submitted_at,reviewed_at,created_at,updated_at')"
          new_select = ".select('id,applicant_staff_id,applicant_name,applicant_role,work_date,request_type,start_time,end_time,overtime_minutes,compensation_method,reason,holiday_case_count,comp_minutes,notes,status,review_note,submitted_at,reviewed_at,created_at,updated_at,next_day_request_type')"
          if old_select not in s:
              raise SystemExit('overtime select not found')
          s = s.replace(old_select,new_select,1)

          sub1(
              r"  function overtimeSummary\(\)\{.*?\n  \}\n\n  function renderOvertimeRules",
              '''  function overtimeSummary(){
            const {start,end}=overtimeMonthRange(state.overtimeMonth);
            const own=overtimeOwnRows().filter(r=>r.status==='approved');
            const overtimeMinutes=own
              .filter(r=>r.request_type!=='holiday_visit_comp')
              .flatMap(r=>overtimeSegments(r))
              .filter(seg=>seg.date>=start&&seg.date<=end)
              .reduce((sum,seg)=>sum+(Number(seg.minutes)||0),0);
            const compMinutes=own
              .filter(r=>r.request_type==='holiday_visit_comp'&&r.work_date>=start&&r.work_date<=end)
              .reduce((sum,r)=>sum+(Number(r.comp_minutes)||0),0);
            const pendingOvertime=state.overtimeRows.filter(r=>r.status==='pending').length;
            const pendingLeave=state.compLeaveRows.filter(r=>r.status==='pending').length;
            const ownPending=overtimeOwnRows().filter(r=>r.status==='pending').length+compLeaveOwnRows().filter(r=>r.status==='pending').length;
            const balance=compLeaveBalance(state.profile?.id,isoDate(new Date()));
            return {overtimeMinutes,compMinutes,pending:pendingOvertime+pendingLeave,pendingOvertime,pendingLeave,ownPending,balance};
          }

          function renderOvertimeRules''',
              'overtime summary'
          )

          sub1(
              r"  function overtimeRowDetail\(r\)\{.*?\n  \}\n\n  function overtimeRenderTable",
              '''  function overtimeRowDetail(r){
            if(r.request_type==='holiday_visit_comp'){
              return `<div class="ot-detail">${Number(r.holiday_case_count)||0} 案・換休 ${overtimeDurationLabel(r.comp_minutes)}</div>`;
            }
            const start=String(r.start_time||'').slice(0,5),end=String(r.end_time||'').slice(0,5);
            const cross=overtimeCrossesMidnight(start,end);
            const endMinute=(()=>{const x=overtimeNormalizeTime(end);if(!overtimeValid24h(x))return 0;const [h,m]=x.split(':').map(Number);return h*60+m;})();
            const nextInfo=cross&&endMinute>0
              ? `<div class="ot-detail">跨午夜：翌日 ${escapeHTML(overtimeNextDate(r.work_date))}・${escapeHTML(r.next_day_request_type?overtimeTypeLabel(r.next_day_request_type):'日別待審核確認')}</div>`
              : cross?'<div class="ot-detail">跨午夜：至翌日 00:00</div>':'';
            return `<div class="ot-detail">${escapeHTML(start)}–${cross?'翌日 ':''}${escapeHTML(end)}・${overtimeDurationLabel(r.overtime_minutes)}・${overtimeCompensationLabel(r.compensation_method)}</div>${nextInfo}`;
          }

          function overtimeRenderTable''',
              'row detail'
          )

          sub1(
              r"  function payrollBuildRows\(\)\{.*?\n  \}\n\n  function payrollReportRows",
              '''  function payrollBuildRows(){
            const {start,end}=overtimeMonthRange(state.overtimeMonth);
            const approvedOvertime=state.overtimeRows.filter(r=>r.status==='approved');
            const approvedLeave=state.compLeaveRows.filter(r=>r.status==='approved'&&r.leave_date<=end);
            const staffIds=new Set([
              ...approvedOvertime.filter(r=>overtimeRowTouchesRange(r,start,end)).map(r=>r.applicant_staff_id),
              ...approvedLeave.filter(r=>r.leave_date>=start&&r.leave_date<=end).map(r=>r.applicant_staff_id)
            ]);
            const rows=[];

            staffIds.forEach(staffId=>{
              const staffOvertime=approvedOvertime.filter(r=>r.applicant_staff_id===staffId);
              const timedSegments=staffOvertime.filter(r=>r.request_type!=='holiday_visit_comp').flatMap(r=>overtimeSegments(r)).filter(seg=>seg.date>=start&&seg.date<=end);
              const holidayRows=staffOvertime.filter(r=>r.request_type==='holiday_visit_comp'&&r.work_date>=start&&r.work_date<=end);
              const monthLeave=approvedLeave.filter(r=>r.applicant_staff_id===staffId&&r.leave_date>=start&&r.leave_date<=end);
              const overtimePayItems=timedSegments.filter(seg=>seg.compensationMethod==='overtime_pay').map(seg=>({
                id:seg.requestId,segmentIndex:seg.segmentIndex,date:seg.date,type:seg.type,startTime:seg.startTime,endTime:seg.endTime,minutes:Number(seg.minutes)||0,reason:seg.reason||''
              }));
              const compLeaveEarnedItems=[
                ...timedSegments.filter(seg=>seg.compensationMethod==='comp_leave').map(seg=>({
                  id:seg.requestId,segmentIndex:seg.segmentIndex,date:seg.date,type:seg.type,startTime:seg.startTime,endTime:seg.endTime,minutes:Number(seg.minutes)||0,reason:seg.reason||''
                })),
                ...holidayRows.map(r=>({id:r.id,date:r.work_date,type:r.request_type,startTime:null,endTime:null,minutes:Number(r.comp_minutes)||0,reason:r.reason||''}))
              ];
              const compLeaveUsedItems=monthLeave.map(r=>({id:r.id,date:r.leave_date,startTime:String(r.start_time||'').slice(0,5),endTime:String(r.end_time||'').slice(0,5),minutes:Number(r.minutes)||0,reason:r.reason||''}));

              const balance=compLeaveBalance(staffId,end);
              const overtimePayMinutes=overtimePayItems.reduce((sum,r)=>sum+(Number(r.minutes)||0),0);
              const compLeaveEarnedMinutes=compLeaveEarnedItems.reduce((sum,r)=>sum+(Number(r.minutes)||0),0);
              const compLeaveUsedMinutes=compLeaveUsedItems.reduce((sum,r)=>sum+(Number(r.minutes)||0),0);
              const compLeaveBalanceMinutes=Math.max(0,Number(balance.ledgerRemaining)||0);
              if(overtimePayMinutes===0&&compLeaveEarnedMinutes===0&&compLeaveUsedMinutes===0&&compLeaveBalanceMinutes===0)return;
              const meta=state.overtimeRows.find(r=>r.applicant_staff_id===staffId)||state.compLeaveRows.find(r=>r.applicant_staff_id===staffId)||{};
              rows.push({staffId,name:meta.applicant_name||'未命名',role:meta.applicant_role||'',overtimePayMinutes,compLeaveEarnedMinutes,compLeaveUsedMinutes,compLeaveBalanceMinutes,overtimePayItems,compLeaveEarnedItems,compLeaveUsedItems});
            });
            return rows.sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh-Hant'));
          }

          function payrollReportRows''',
              'payrollBuildRows'
          )

          old_pending = "const pendingOvertime=state.overtimeRows.filter(r=>r.work_date>=start && r.work_date<=end && r.status==='pending').length;"
          new_pending = "const pendingOvertime=state.overtimeRows.filter(r=>r.status==='pending'&&overtimeRowTouchesRange(r,start,end)).length;"
          if old_pending not in s:
              raise SystemExit('close month pending overtime line not found')
          s = s.replace(old_pending,new_pending,1)

          old_zero = "if(timeBased && overtimeMinutes<=0){toast('結束時間須晚於開始時間','warn');return false;}"
          new_zero = "if(timeBased && overtimeMinutes<=0){toast('開始時間與結束時間不可相同','warn');return false;}"
          if old_zero not in s:
              raise SystemExit('base zero-duration validation not found')
          s = s.replace(old_zero,new_zero,1)

          old_payload = "      overtime_minutes:overtimeMinutes,\n      compensation_method:compensationMethod,"
          new_payload = "      overtime_minutes:overtimeMinutes,\n      next_day_request_type:null,\n      compensation_method:compensationMethod,"
          if old_payload not in s:
              raise SystemExit('base overtime payload insertion point not found')
          s = s.replace(old_payload,new_payload,1)

          old_calc = "if($('otMinuteCalc')) $('otMinuteCalc').textContent=!valid?'請選擇完整的開始與結束時間':minutes?`${minutes}分鐘（${overtimeDurationLabel(minutes)}）`:'結束時間須晚於開始時間';"
          new_calc = "if($('otMinuteCalc')) $('otMinuteCalc').textContent=!valid?'請選擇完整的開始與結束時間':minutes?`${minutes}分鐘（${overtimeDurationLabel(minutes)}）${overtimeCrossesMidnight(start,end)?'；跨午夜，00:00後歸翌日':''}`:'開始時間與結束時間不可相同';"
          if old_calc not in s:
              raise SystemExit('base overtime duration preview not found')
          s = s.replace(old_calc,new_calc,1)

          rule_anchor = '系統依時間自動計算加班分鐘數。</li>'
          if '跨午夜會於 00:00 自動拆分' not in s:
              if rule_anchor not in s:
                  raise SystemExit('rules insertion anchor not found')
              s = s.replace(rule_anchor,rule_anchor+'\n          <li>加班若跨越午夜，系統會於 00:00 自動拆分為兩個日期；翌日日別由審核者依實際排班／假別確認，各段分別使用當日有效薪資設定與倍率順位。</li>',1)

          path.write_text(s,encoding='utf-8')
          PY

      - name: Static checks
        run: |
          grep -q "globalThis.v52OvertimeSegments=overtimeSegments" v52/overtime-patch.txt
          grep -q "next_day_request_type" v52/overtime-patch.txt
          grep -q "跨午夜，00:00後歸翌日" v52/overtime-patch.txt
          node --check < v52/overtime-patch.txt

      - name: Commit base overtime changes
        run: |
          git config user.name "openai-maintenance-bot"
          git config user.email "openai-maintenance-bot@users.noreply.github.com"
          git add v52/overtime-patch.txt
          git commit -m "Split base overtime views across midnight"
          git push origin main
