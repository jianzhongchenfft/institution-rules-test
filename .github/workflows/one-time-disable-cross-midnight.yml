name: One-time disable cross-midnight applications
on:
  push:
    paths:
      - '.github/workflows/one-time-disable-cross-midnight.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/disable_cross_midnight.py
      - run: |
          node --check < v52/overtime-patch.txt
          node --check < v52/overtime-payroll-calc-patch.txt
          node --check < v52/overtime-personal-hours-patch.txt
          node --check < v52/overtime-workflow-patch.txt
          node --check < v52/overtime-withdraw-patch.txt
          ! grep -q "overtime-midnight-split-patch.txt" v51/part07.txt
          grep -q "跨午夜加班請分成兩筆申請" v52/overtime-patch.txt
          grep -q "第一天結束時間填00:00" v52/overtime-patch.txt
          git diff --check
      - run: |
          git config user.name openai-maintenance-bot
          git config user.email openai-maintenance-bot@users.noreply.github.com
          git add v51/part07.txt v52/overtime-patch.txt v52/overtime-payroll-calc-patch.txt v52/overtime-personal-hours-patch.txt v52/overtime-workflow-patch.txt v52/overtime-withdraw-patch.txt
          git commit -m 'Require manual split for cross-midnight overtime'
          git push origin main
