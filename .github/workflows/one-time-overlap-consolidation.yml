name: One-time overtime overlap consolidation

on:
  push:
    paths:
      - '.github/workflows/one-time-overlap-consolidation.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Consolidate overlap validation
        shell: python
        run: |
          from pathlib import Path
          import re

          payroll_path = Path('v52/overtime-payroll-calc-patch.txt')
          payroll = payroll_path.read_text(encoding='utf-8')

          pattern = re.compile(r"\n  function prCheckOverlap\(type,date,start,end,existingId\)\{.*?\n  \}\n\n  async function prSaveNewType", re.S)
          if not pattern.search(payroll):
              raise SystemExit('duplicate payroll overlap function not found')
          payroll = pattern.sub('\n  async function prSaveNewType', payroll, count=1)

          old_call = "    if(!prCheckOverlap(type,date,start,end,existingId))return false;\n"
          if old_call not in payroll:
              raise SystemExit('duplicate payroll overlap call not found')
          payroll = payroll.replace(old_call, '', 1)
          payroll_path.write_text(payroll, encoding='utf-8')

          workflow_path = Path('v52/overtime-workflow-patch.txt')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_types = "      'overtime',\n      'holiday_overtime',\n      'rest_day_overtime',\n      'national_holiday_overtime'\n"
          new_types = "      'overtime',\n      'holiday_overtime',\n      'rest_day_overtime',\n      'national_holiday_overtime',\n      'regular_day_off_overtime'\n"
          if old_types not in workflow:
              raise SystemExit('workflow timed type block not found')
          workflow = workflow.replace(old_types, new_types, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

      - name: Commit consolidation
        run: |
          git config user.name "openai-maintenance-bot"
          git config user.email "openai-maintenance-bot@users.noreply.github.com"
          git add v52/overtime-payroll-calc-patch.txt v52/overtime-workflow-patch.txt
          git commit -m "Consolidate overtime overlap validation"
          git push origin main
