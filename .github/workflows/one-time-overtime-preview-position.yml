name: One-time overtime preview position

on:
  push:
    paths:
      - '.github/workflows/one-time-overtime-preview-position.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align overtime preview with same-day tier position
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Static checks
        run: |
          grep -q "v52OvertimePayrollPreviewPosition" v52/overtime-payroll-calc-patch.txt
          grep -q "v52OvertimePayrollCalcSegment" v52/overtime-personal-hours-patch.txt
          node --check < v52/overtime-payroll-calc-patch.txt
          node --check < v52/overtime-personal-hours-patch.txt
      - name: Commit preview update
        run: |
          git config user.name "openai-maintenance-bot"
          git config user.email "openai-maintenance-bot@users.noreply.github.com"
          git add v52/overtime-payroll-calc-patch.txt v52/overtime-personal-hours-patch.txt
          git commit -m "Use same-day tier position in overtime previews"
          git push origin main
