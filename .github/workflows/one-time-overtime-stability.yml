name: One-time overtime stability cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-overtime-stability.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add one-time overtime stability workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove duplicate navigate wrappers
        shell: python
        run: |
          from pathlib import Path

          calc_path = Path('v52/overtime-payroll-calc-patch.txt')
          calc = calc_path.read_text(encoding='utf-8')
          calc_old = """  const baseNavigate=navigate;\n  navigate=function(id){\n    const r=baseNavigate(id);\n    if(id==='overtime')setTimeout(()=>prLoad(true),170);\n    return r;\n  };\n\n"""
          if calc_old not in calc:
              raise SystemExit('payroll calc navigate wrapper not found')
          calc = calc.replace(calc_old, '', 1)
          calc_path.write_text(calc, encoding='utf-8')

          ph_path = Path('v52/overtime-personal-hours-patch.txt')
          ph = ph_path.read_text(encoding='utf-8')
          ph_old = """  const baseNavigate=navigate;\n  navigate=function(id){const r=baseNavigate(id);if(id==='overtime')setTimeout(()=>load(true),260);return r;};\n"""
          if ph_old not in ph:
              raise SystemExit('personal hours navigate wrapper not found')
          ph = ph.replace(ph_old, '', 1)

          observer_old = """  let queued=false;const observer=new MutationObserver(ms=>{if(queued||!ms.some(m=>m.addedNodes?.length))return;queued=true;setTimeout(()=>{queued=false;enhance();},40);});observer.observe(document.body,{childList:true,subtree:true});\n"""
          observer_new = """  let queued=false;const observer=new MutationObserver(ms=>{if(queued||!ms.some(m=>m.addedNodes?.length))return;queued=true;setTimeout(()=>{queued=false;if(state.page==='overtime'){if(!state.personalHoursLoaded)load();else enhance();}},40);});observer.observe(document.body,{childList:true,subtree:true});\n"""
          if observer_old not in ph:
              raise SystemExit('personal hours observer not found')
          ph = ph.replace(observer_old, observer_new, 1)
          ph_path.write_text(ph, encoding='utf-8')

      - name: Commit cleanup
        run: |
          git config user.name "openai-maintenance-bot"
          git config user.email "openai-maintenance-bot@users.noreply.github.com"
          git add v52/overtime-payroll-calc-patch.txt v52/overtime-personal-hours-patch.txt
          git commit -m "Remove duplicate overtime navigation wrappers"
          git push origin main
