name: One-time payroll single save path

on:
  push:
    paths:
      - '.github/workflows/one-time-payroll-single-save-path.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy payroll save path
        shell: python
        run: |
          from pathlib import Path
          import re

          calc_path = Path('v52/overtime-payroll-calc-patch.txt')
          calc = calc_path.read_text(encoding='utf-8')

          old_confirm = "      onConfirm:prSaveRate,\n"
          new_confirm = "      onConfirm:()=>{\n        if(typeof globalThis.v52SaveStaffPayrollRateAtomic!=='function'){toast('薪資設定儲存模組尚未載入，請重新整理頁面','error');return false;}\n        return globalThis.v52SaveStaffPayrollRateAtomic();\n      },\n"
          if old_confirm not in calc:
              raise SystemExit('legacy onConfirm binding not found')
          calc = calc.replace(old_confirm, new_confirm, 1)

          pattern = re.compile(r"\n  async function prSaveRate\(\)\{.*?\n  \}\n\n  function prEnsureSettingsButton", re.S)
          if not pattern.search(calc):
              raise SystemExit('legacy prSaveRate function not found')
          calc = pattern.sub('\n\n  function prEnsureSettingsButton', calc, count=1)
          calc_path.write_text(calc, encoding='utf-8')

          ph_path = Path('v52/overtime-personal-hours-patch.txt')
          ph = ph_path.read_text(encoding='utf-8')

          marker = "  function currentStaffHours(){return Number(staffFor(state.profile?.id)?.agreed_daily_hours)||null;}\n"
          export_line = "  globalThis.v52SaveStaffPayrollRateAtomic=saveRateFromModal;\n\n"
          if export_line not in ph:
              if marker not in ph:
                  raise SystemExit('atomic save export insertion point not found')
              ph = ph.replace(marker, export_line + marker, 1)

          interceptor = re.compile(r"\n  document\.addEventListener\('click',e=>\{\n    const b=e\.target\.closest\?\.\('button'\);if\(!b\)return;\n    const modal=b\.closest\('\.modal'\);\n    if\(canReview\(\)&&modal\?\.querySelector\('#prRateStaff'\)&&b\.id==='modalConfirm'\)\{\n      e\.preventDefault\(\);e\.stopImmediatePropagation\(\);saveRateFromModal\(\);return;\n    \}\n  \},true\);\n", re.S)
          if not interceptor.search(ph):
              raise SystemExit('legacy payroll click interceptor not found')
          ph = interceptor.sub('\n', ph, count=1)
          ph_path.write_text(ph, encoding='utf-8')

      - name: Commit cleanup
        run: |
          git config user.name "openai-maintenance-bot"
          git config user.email "openai-maintenance-bot@users.noreply.github.com"
          git add v52/overtime-payroll-calc-patch.txt v52/overtime-personal-hours-patch.txt
          git commit -m "Use single atomic payroll setting save path"
          git push origin main
