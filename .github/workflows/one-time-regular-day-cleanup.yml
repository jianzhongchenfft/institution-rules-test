name: One-time regular-day cleanup
on:
  push:
    paths:
      - '.github/workflows/one-time-regular-day-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/regular_day_cleanup.py
      - run: |
          node --check < v52/overtime-payroll-calc-patch.txt
          node --check < v52/overtime-midnight-split-patch.txt
          git diff --check
      - run: |
          git config user.name openai-maintenance-bot
          git config user.email openai-maintenance-bot@users.noreply.github.com
          git add v52/overtime-payroll-calc-patch.txt v52/overtime-midnight-split-patch.txt
          git commit -m 'Restrict regular-day overtime to midnight continuation'
          git push origin main
