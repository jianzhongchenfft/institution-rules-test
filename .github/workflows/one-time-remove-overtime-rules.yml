name: One-time remove overtime rules tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-remove-overtime-rules.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove overtime rules view
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('v52/overtime-patch.txt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// V5.2 加班／換休管理：申請、審核與規則','// V5.2 加班／換休管理：申請與審核',1)
          s,n=re.subn(r'  function renderOvertimeRules\(\)\{.*?^  function overtimeRowDetail', '  function overtimeRowDetail', s, count=1, flags=re.S|re.M)
          if n!=1: raise SystemExit('renderOvertimeRules block not found')
          s=s.replace("['mine','balance','usage','review','payroll','rules']","['mine','balance','usage','review','payroll']",1)
          s=s.replace("['mine','balance','usage','rules']","['mine','balance','usage']",1)
          s=s.replace("['review','payroll','rules']","['review','payroll']",1)
          s=s.replace("['rules']","['mine']",1)
          s,n=re.subn(r'\n\s*<button class="ot-tab[^\n]*data-ot-view="rules"[^\n]*</button>', '', s, count=1)
          if n!=1: raise SystemExit('rules button not found')
          s,n=re.subn(r"\$\{state\.overtimeView==='rules' \? renderOvertimeRules\(\)\s*: state\.overtimeView==='review' \? renderOvertimeReview\(\)", "${state.overtimeView==='review' ? renderOvertimeReview()", s, count=1)
          if n!=1: raise SystemExit('rules render branch not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          set -euo pipefail
          node --check < v52/overtime-patch.txt
          ! grep -q '加班規則' v52/overtime-patch.txt
          ! grep -q 'renderOvertimeRules' v52/overtime-patch.txt
          ! grep -q "overtimeView==='rules'" v52/overtime-patch.txt
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v52/overtime-patch.txt
          git commit -m 'Remove overtime rules tab from test'
          git push origin main
