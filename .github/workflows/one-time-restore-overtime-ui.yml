name: Restore overtime UI after cross-midnight regression

on:
  push:
    paths:
      - '.github/workflows/one-time-restore-overtime-ui.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore last verified overtime frontend baseline
        run: |
          git checkout 5bd5b5e8108951cbe649b57294c2571aa1c3056f -- v52/overtime-patch.txt v51/part07.txt
          git diff --check
          grep -q "overtime-payroll-calc-patch.txt" v51/part07.txt
          if grep -q "overtime-cross-midnight-patch.txt" v51/part07.txt; then
            echo "cross-midnight loader still present" >&2
            exit 1
          fi
      - name: Commit restoration
        run: |
          git config user.name "openai-maintenance-bot"
          git config user.email "openai-maintenance-bot@users.noreply.github.com"
          git add v52/overtime-patch.txt v51/part07.txt
          git commit -m "Restore verified overtime frontend after loading regression"
          git push origin main
