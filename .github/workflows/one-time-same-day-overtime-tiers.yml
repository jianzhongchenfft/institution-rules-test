name: One-time same-day overtime tier consolidation

on:
  push:
    paths:
      - '.github/workflows/one-time-same-day-overtime-tiers.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Consolidate same-day overtime tier calculation
        run: python -c "import base64; exec(base64.b64decode(' 過4小時，需人工確認'};
      const a=prRangeMinutes(offset,m,0,120),b=prRangeMinutes(offset,m,120,240);
      amount=h*(a/60)*(4/3)+h*(b/60)*(5/3);
      formula=`${monthly.toFixed(2)}÷30÷${hours}；同日依實際時間順序累計，本筆位於當日第${offset+1}–${dayEnd}分鐘；前2小時×4/3、其後2小時×5/3`;
    }else if(type==='rest_day_overtime'){
      if(dayEnd>720)return {ok:false,code:'limit',text:'休息日當日累計出勤超過12小時'};
      const a=prRangeMinutes(offset,m,0,120),b=prRangeMinutes(offset,m,120,480),c=prRangeMinutes(offset,m,480,720);
      amount=h*(a/60)*(4/3)+h*(b/60)*(5/3)+h*(c/60)*(8/3);
      formula=`${monthly.toFixed(2)}÷30÷${hours}；同日依實際時間順序累計，本筆位於當日第${offset+1}–${dayEnd}分鐘；前2小時×4/3、第3–8小時×5/3、第9–12小時×8/3`;
    }else if(type==='national_holiday_overtime'){
      const normalMinutes=Math.round(hours*60);
      if(dayEnd>normalMinutes+240)return {ok:false,code:'limit',text:'國定假日當日累計出勤超過約定每日工時加4小時，請重新確認'};
      amount=includeDayBase?monthly/30:0;
      const a=prRangeMinutes(offset,m,normalMinutes,normalMinutes+120),b=prRangeMinutes(offset,m,normalMinutes+120,normalMinutes+240);
      amount+=h*(a/60)*(4/3)+h*(b/60)*(5/3);
      formula=`${includeDayBase?monthly.toFixed(2)+'÷30為當日一次日工資；':'當日日工資已於同日其他領加班費紀錄認列；'}同日依實際時間順序累計，本筆位於當日第${offset+1}–${dayEnd}分鐘；約定每日工時${hours}小時，超過後前2小時×4/3、再2小時×5/3`;
    }else if(type==='regular_day_off_overtime'){
      const normalMinutes=Math.round(hours*60);
      if(dayEnd>normalMinutes+240)return {ok:false,code:'limit',text:'例假日當日累計出勤超過約定每日工時加4小時，請重新確認'};
      amount=includeDayBase?monthly/30:0;
      const extra=prRangeMinutes(offset,m,normalMinutes,normalMinutes+240);
      amount+=h*(extra/60)*2;
      formula=`${includeDayBase?monthly.toFixed(2)+'÷30為當日一次日工資；':'當日日工資已於同日其他領加班費紀錄認列；'}同日依實際時間順序累計，本筆位於當日第${offset+1}–${dayEnd}分鐘；約定每日工時${hours}小時，超過部分×2`;
    }
    return {ok:true,amount,hourly:h,monthly,hours,formula,dayOffset:offset,dayEnd};
  }

  async function prLoad'''
if not calc_pattern.search(calc):
    raise SystemExit('prCalc block not found')
calc = calc_pattern.sub(new_calc, calc, count=1)

staff_pattern = re.compile(r"  function prStaffCalc\(staffId\)\{.*?\n  \}\n  function prSettlement", re.S)
new_staff = r'''  function prStaffCalc(staffId,rateResolver=prRateFor){
    const {start,end}=prMonthRange();
    const rows=(state.overtimeRows||[])
      .filter(r=>String(r.applicant_staff_id)===String(staffId)&&r.status==='approved'&&r.work_date>=start&&r.work_date<=end&&timedTypes.has(r.request_type))
      .filter(r=>r.request_type!=='holiday_visit_comp')
      .sort((a,b)=>String(a.work_date).localeCompare(String(b.work_date))||String(a.start_time||'').localeCompare(String(b.start_time||''))||String(a.end_time||'').localeCompare(String(b.end_time||''))||String(a.created_at||'').localeCompare(String(b.created_at||'')));
    const details=[];
    let currentDate=null,dayOffset=0,dayBasePaid=false;
    rows.forEach(r=>{
      if(currentDate!==r.work_date){currentDate=r.work_date;dayOffset=0;dayBasePaid=false;}
      const minutes=Number(r.overtime_minutes)||0;
      const rowOffset=dayOffset;
      const isCash=r.compensation_method==='overtime_pay';
      if(isCash){
        const rate=rateResolver(staffId,r.work_date);
        const includeDayBase=!dayBasePaid;
        const c=prCalc(r.request_type,minutes,rate,rowOffset,includeDayBase);
        details.push({
          id:r.id,date:r.work_date,type:r.request_type,
          startTime:String(r.start_time||'').slice(0,5),endTime:String(r.end_time||'').slice(0,5),
          minutes,reason:r.reason||'',staffId,row:r,rate,calc:c,dayOffset:rowOffset
        });
        if(c.ok&&includeDayBase&&['national_holiday_overtime','regular_day_off_overtime'].includes(r.request_type))dayBasePaid=true;
      }
      dayOffset+=minutes;
    });
    const ok=details.length>0&&details.every(d=>d.calc.ok);
    const total=details.filter(d=>d.calc.ok).reduce((s,d)=>s+d.calc.amount,0);
    return {details,ok,total,missing:details.filter(d=>!d.calc.ok)};
  }
  globalThis.v52OvertimePayrollStaffCalc=prStaffCalc;

  function prSettlement'''
if not staff_pattern.search(calc):
    raise SystemExit('prStaffCalc block not found')
calc = staff_pattern.sub(new_staff, calc, count=1)

old_note = "計算過程保留完整精度，明細僅顯示至小數點後2位；各員工整月加總完成後，實際應發加班費才四捨五入至整元。"
new_note = "同一員工同一天的實際加班會依起訖時間排序後累計倍率順位，包含選擇換休的實際加班時數；假日家訪換休不列入倍率順位。計算過程保留完整精度，明細僅顯示至小數點後2位；各員工整月加總完成後，實際應發加班費才四捨五入至整元。"
if old_note not in calc:
    raise SystemExit('payroll calculation note text not found')
calc = calc.replace(old_note, new_note, 1)
calc_path.write_text(calc, encoding='utf-8')

ph_path = Path('v52/overtime-personal-hours-patch.txt')
ph = ph_path.read_text(encoding='utf-8')
live_pattern = re.compile(r"  function staffLiveCalc\(staffId\)\{.*?\n  \}\n\n  function enhancePayroll", re.S)
new_live = r'''  function staffLiveCalc(staffId){
    if(typeof globalThis.v52OvertimePayrollStaffCalc==='function'){
      return globalThis.v52OvertimePayrollStaffCalc(staffId,rateFor);
    }
    const {start,end}=monthRange();
    const details=(state.overtimeRows||[])
      .filter(r=>String(r.applicant_staff_id)===String(staffId)&&r.status==='approved'&&r.compensation_method==='overtime_pay'&&r.work_date>=start&&r.work_date<=end&&timedTypes.has(r.request_type))
      .map(r=>{const rate=rateFor(staffId,r.work_date),c=calc(r.request_type,Number(r.overtime_minutes)||0,rate);return {row:r,rate,calc:c};});
    const missing=details.filter(x=>!x.calc.ok),total=details.filter(x=>x.calc.ok).reduce((s,x)=>s+x.calc.amount,0);
    return {details,missing,total,ok:missing.length===0};
  }

  function enhancePayroll'''
if not live_pattern.search(ph):
    raise SystemExit('staffLiveCalc block not found')
ph = live_pattern.sub(new_live, ph, count=1)

old_ph_note = "計算全程保留完整精度，明細僅顯示2位小數，各員工整月加總後的實際應發金額才四捨五入至整元。"
new_ph_note = "同一員工同一天依實際起訖時間排序累計倍率順位，選擇換休的實際加班時數也會占用順位，假日家訪換休除外；計算全程保留完整精度，明細僅顯示2位小數，各員工整月加總後的實際應發金額才四捨五入至整元。"
if old_ph_note not in ph:
    raise SystemExit('personal hours payroll note text not found')
ph = ph.replace(old_ph_note, new_ph_note, 1)
ph_path.write_text(ph, encoding='utf-8')
'))"

      - name: Static checks
        run: |
          grep -q "globalThis.v52OvertimePayrollStaffCalc=prStaffCalc" v52/overtime-payroll-calc-patch.txt
          grep -q "dayOffset+=minutes" v52/overtime-payroll-calc-patch.txt
          grep -q "假日家訪換休不列入倍率順位" v52/overtime-payroll-calc-patch.txt
          grep -q "globalThis.v52OvertimePayrollStaffCalc(staffId,rateFor)" v52/overtime-personal-hours-patch.txt
          node --check < v52/overtime-payroll-calc-patch.txt
          node --check < v52/overtime-personal-hours-patch.txt

      - name: Commit same-day tier update
        run: |
          git config user.name "openai-maintenance-bot"
          git config user.email "openai-maintenance-bot@users.noreply.github.com"
          git add v52/overtime-payroll-calc-patch.txt v52/overtime-personal-hours-patch.txt
          git commit -m "Accumulate same-day overtime tier positions"
          git push origin main
