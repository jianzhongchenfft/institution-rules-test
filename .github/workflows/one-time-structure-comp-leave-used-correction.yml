name: One-time structure comp leave used correction
on:
  push:
    paths:
      - '.github/workflows/one-time-structure-comp-leave-used-correction.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/one_time_structure_comp_leave_used_correction.py
      - name: Syntax check
        run: |
          node --check < v52/payroll-correction-patch.txt
          git diff --check
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v52/payroll-correction-patch.txt
          git commit -m 'Structure comp leave used payroll corrections'
          git push
