name: One-time trim overtime text retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-trim-overtime-help-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse cleanup script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/one-time-trim-overtime-help.yml').read_text(encoding='utf-8')
          start=text.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=text.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          exec(compile(code,'cleanup.py','exec'))
          PY
      - name: Verify and commit
        run: |
          set -euo pipefail
          files=(v52/overtime-patch.txt v52/payroll-correction-patch.txt v52/overtime-integrity-patch.txt v52/comp-leave-expiry-patch.txt)
          for f in "${files[@]}"; do
            sed -i 's/[[:space:]]\+$//' "$f"
            node --check < "$f"
          done
          ! grep -q '僅計已核准申請' v52/overtime-patch.txt
          ! grep -q '依換休台帳，已扣除待審核' v52/overtime-patch.txt
          ! grep -q '含加班與換休使用' v52/overtime-patch.txt
          ! grep -q '24小時制，分鐘以10分鐘為間隔' v52/overtime-patch.txt
          ! grep -q '24小時制，分鐘以30分鐘為間隔' v52/overtime-patch.txt
          ! grep -q '填寫加班申請、管理換休取得與使用' v52/overtime-patch.txt
          ! grep -q '原月結＋月結更正' v52/payroll-correction-patch.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Trim overtime explanatory text in test'
          git push origin main
