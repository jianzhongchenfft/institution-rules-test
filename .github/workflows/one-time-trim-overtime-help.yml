name: One-time trim overtime explanatory text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-trim-overtime-help.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trim nonessential explanatory text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'missing: {label}')
              return s.replace(old, new, 1)

          # Main overtime UI
          p=Path('v52/overtime-patch.txt')
          s=p.read_text(encoding='utf-8')

          # Page subtitle
          s=replace_exact(s,
              '<div><h1>⏱ 加班／換休管理</h1><p>填寫加班申請、管理換休取得與使用，並集中處理審核紀錄。</p></div>',
              '<div><h1>⏱ 加班／換休管理</h1></div>',
              'page subtitle')

          # Summary-card explanatory footers (keep settlement audit metadata only)
          footers=[
              '<div class="stat-foot">僅計已核准申請</div>',
              '<div class="stat-foot">依換休台帳，已扣除待審核</div>',
              '<div class="stat-foot">與目前剩餘換休相同</div>',
              '<div class="stat-foot">${canReview?\'含加班與換休使用\':\'已送出等待審核\'}</div>',
              '<div class="stat-foot">等待處理</div>',
              '<div class="stat-foot">依目前仍有效的換休台帳</div>',
              '<div class="stat-foot">僅計已核准使用</div>',
              '<div class="stat-foot">送審中，暫時保留</div>',
              '<div class="stat-foot">僅計已核准且選擇領加班費</div>',
              '<div class="stat-foot">已核准且選擇換休</div>'
          ]
          for i,old in enumerate(footers,1):
              s=s.replace(old,'')
          old='<div class="stat-foot">${settlement?escapeHTML(settledInfo):\'確認發薪資料後再鎖定\'}</div>'
          new='${settlement?`<div class="stat-foot">${escapeHTML(settledInfo)}</div>`:\'\'}'
          s=replace_exact(s,old,new,'settlement status footer')

          # Generic empty-state second lines: keep the concise heading only.
          s=s.replace("<div class=\"ot-empty\"><div class=\"icon\">✓</div><h3>目前沒有資料</h3><p>${review?'沒有待審核的加班／換休申請。':'尚無符合條件的申請紀錄。'}</p></div>","<div class=\"ot-empty\"><div class=\"icon\">✓</div><h3>目前沒有資料</h3></div>")
          s=s.replace("<div class=\"ot-empty\"><div class=\"icon\">🕒</div><h3>目前沒有資料</h3><p>${review?'沒有待審核的換休使用申請。':'尚無換休使用紀錄。'}</p></div>","<div class=\"ot-empty\"><div class=\"icon\">🕒</div><h3>目前沒有資料</h3></div>")
          s=s.replace('<div class="ot-empty"><div class="icon">🕒</div><h3>尚無換休取得紀錄</h3><p>已核准且選擇「換休」的加班或假日家訪換休，會自動列在這裡。</p></div>','<div class="ot-empty"><div class="icon">🕒</div><h3>尚無換休取得紀錄</h3></div>')
          s=s.replace('<div class="ot-empty"><div class="icon">💰</div><h3>本月尚無可結算資料</h3><p>已核准的加班、換休取得或換休使用紀錄會顯示在這裡。</p></div>','<div class="ot-empty"><div class="icon">💰</div><h3>本月尚無可結算資料</h3></div>')

          # Payroll section: remove normal-use description and obsolete explanatory banner.
          s=s.replace('<p>提供機構負責人發薪前核對已核准的加班與換休紀錄。</p>','')
          s=s.replace('        <div class="ot-rule-highlight">目前先以「待計薪加班時數」供薪資核對。系統尚未保存各員工月薪計算基數，且「假日加班」尚未細分休息日、例假日或國定假日，因此本版不自動換算加班費金額，避免誤算。</div>\n','')

          # Static form help is redundant because selectable values are already constrained.
          s=s.replace('<div class="help">24小時制，分鐘以10分鐘為間隔（00／10／20／30／40／50）</div>','')
          s=s.replace('<div class="help">24小時制，分鐘以30分鐘為間隔（00／30）</div>','')
          s=s.replace('<div id="otCompensationHelp" class="help"></div>','')
          s=re.sub(r"\n\s*\$\('otCompensationHelp'\)\.textContent='[^']*';",'',s)

          p.write_text(s,encoding='utf-8')

          # Month-close correction UI: no card footnote rewrites, remove normal-use explanation.
          p=Path('v52/payroll-correction-patch.txt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  function pcUpdateCard(label,value,foot=null){','  function pcUpdateCard(label,value){',1)
          s=re.sub(r"\n\s*if\(foot\)\{\n\s*const f=card\.querySelector\('\.stat-foot'\);\n\s*if\(f&&f\.textContent!==foot\)f\.textContent=foot;\n\s*\}",'',s,count=1)
          s=s.replace('<div><h3>月結後更正</h3><p>原月結資料保持鎖定；後續調整以獨立更正單追加，不覆蓋原始結算。</p></div>','<div><h3>月結後更正</h3></div>',1)
          s=s.replace('<div class="ot-empty"><div class="icon">🧾</div><h3>尚無月結更正</h3><p>若結算後才發現漏算或誤算，可由機構負責人建立更正單。</p></div>','<div class="ot-empty"><div class="icon">🧾</div><h3>尚無月結更正</h3></div>',1)
          s=re.sub(r"pcUpdateCard\(('本月待計薪加班'|'本月新增換休'|'本月使用換休'),([^;]+?),[^;]+?\);",r"pcUpdateCard(\1,\2);",s)
          p.write_text(s,encoding='utf-8')

          # Integrity modal: remove secondary no-data explanation, keep lock/void warnings.
          p=Path('v52/overtime-integrity-patch.txt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="ot-empty"><div class="icon">✓</div><h3>本月沒有可更正的已核准紀錄</h3><p>只有已核准且尚未作廢的紀錄會列在這裡。</p></div>','<div class="ot-empty"><div class="icon">✓</div><h3>本月沒有可更正的已核准紀錄</h3></div>',1)
          p.write_text(s,encoding='utf-8')

          # Expiry view: remove normal-state prose and secondary empty-state explanation.
          # Keep expiry warnings, settlement treatment, and settings impact notices.
          p=Path('v52/comp-leave-expiry-patch.txt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('      <p>一般加班換休依到職週年制計算到期日；假日家訪換休無到期限制。使用換休時，系統會先扣除有期限的一般加班換休，再使用永久有效的假日家訪換休。</p>\n','',1)
          s=s.replace('<div class="ot-empty"><div class="icon">🕒</div><h3>尚無換休來源</h3><p>核准為換休的一般加班或假日家訪換休會自動建立來源。</p></div>','<div class="ot-empty"><div class="icon">🕒</div><h3>尚無換休來源</h3></div>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify
        run: |
          set -euo pipefail
          for f in v52/overtime-patch.txt v52/payroll-correction-patch.txt v52/overtime-integrity-patch.txt v52/comp-leave-expiry-patch.txt; do
            node --check < "$f"
          done
          ! grep -q '僅計已核准申請' v52/overtime-patch.txt
          ! grep -q '依換休台帳，已扣除待審核' v52/overtime-patch.txt
          ! grep -q '含加班與換休使用' v52/overtime-patch.txt
          ! grep -q '24小時制，分鐘以10分鐘為間隔' v52/overtime-patch.txt
          ! grep -q '24小時制，分鐘以30分鐘為間隔' v52/overtime-patch.txt
          ! grep -q '填寫加班申請、管理換休取得與使用' v52/overtime-patch.txt
          ! grep -q '原月結＋月結更正' v52/payroll-correction-patch.txt
          git diff --check

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v52/overtime-patch.txt v52/payroll-correction-patch.txt v52/overtime-integrity-patch.txt v52/comp-leave-expiry-patch.txt
          git commit -m 'Trim overtime explanatory text in test'
          git push origin main
