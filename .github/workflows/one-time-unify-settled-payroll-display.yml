name: One-time unify settled payroll display
on:
  push:
    paths:
      - '.github/workflows/one-time-unify-settled-payroll-display.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/one_time_unify_settled_payroll_display.py
      - name: Syntax check
        run: |
          node --check < v52/overtime-payroll-summary-patch.txt
          node --check < v52/overtime-payroll-calc-patch.txt
          git diff --check
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v52/overtime-payroll-summary-patch.txt v52/overtime-payroll-calc-patch.txt
          git commit -m 'Use snapshot source for settled payroll display'
          git push
