name: Repair cross-midnight base workflow

on:
  push:
    paths:
      - '.github/workflows/repair-cross-midnight-base.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair replacement callback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/one-time-cross-midnight-base.yml')
          s=p.read_text(encoding='utf-8')
          old="s2, n = re.subn(pattern, repl, s, count=1, flags=re.S)"
          new="s2, n = re.subn(pattern, lambda _m: repl, s, count=1, flags=re.S)"
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "openai-maintenance-bot"
          git config user.email "openai-maintenance-bot@users.noreply.github.com"
          git add .github/workflows/one-time-cross-midnight-base.yml
          git commit -m "Fix cross-midnight migration replacement callback"
          git push origin main
